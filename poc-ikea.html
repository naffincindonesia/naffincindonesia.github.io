<!DOCTYPE html>
<html>
<head>
<title>IKEA CORS PoC - naffinc</title>
<style>body{background:#0f0f0f;color:#0f0;font-family:monospace;padding:20px}.box{max-width:900px;margin:auto;background:#1a1a1a;padding:20px;border:1px solid #333;border-radius:8px}button{background:#0058a3;color:#fff;border:none;padding:10px 18px;border-radius:4px;margin:5px;cursor:pointer}pre{background:#000;padding:12px;white-space:pre-wrap;word-break:break-all;max-height:600px;overflow:auto}.cmd{color:#ffcc00}</style>
</head>
<body>
<div class="box">
<h2 style="color:#ffcc00">IKEA CORS PoC</h2>
<p><b>Target:</b> self-service-portal-api-prod.azurewebsites.net</p>
<p><b>Researcher:</b> naffincindonesia.github.io</p>
<button onclick="scan()">Scan All Endpoints</button>
<button onclick="showCurl()">Show CURL Repro Guide</button>
<pre id="log">Ready. Click Scan All Endpoints.</pre>
</div>
<script>
const base = 'https://self-service-portal-api-prod.azurewebsites.net';
const paths = ['/','/api','/api/health','/health','/swagger','/api-docs','/v1','/api/v1'];
const logEl = document.getElementById('log');
function log(m){ logEl.textContent += '\n' + m; }
async function scan(){
 logEl.textContent = 'Browser scan from: '+location.origin+'\n';
 for(let p of paths){
   const url = base + p;
   log('\n--- Testing: ' + url + ' ---');
   try{
     const res = await fetch(url, {method:'GET', mode:'cors'});
     log('Status: ' + res.status + ' ACAO: ' + res.headers.get('access-control-allow-origin'));
   }catch(e){
     log('Fetch Error: ' + e.message);
     try{ await fetch(url, {mode:'no-cors'}); log('Result: opaque - SERVER ALIVE, CORS not returned on GET'); }
     catch(e2){ log('Dead: ' + e2.message); }
   }
 }
}
function showCurl(){
 logEl.textContent += '\n\n=== CURL REPRO - RUN IN TERMINAL ===\n';
 logEl.textContent += 'curl -i -X HEAD -H "Origin: https://naffincindonesia.github.io" '+base+'/\n';
 logEl.textContent += 'curl -i -H "Origin: https://naffincindonesia.github.io" '+base+'/\n';
}
</script>
</body>
</html>
