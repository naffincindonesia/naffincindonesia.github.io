<!DOCTYPE html>
<html>
<head>
<title>PoC by Naffinc</title>
<style>
body { font-family: Arial; text-align: center; margin-top: 80px; }
.box { width: 300px; padding: 20px; margin: auto; border-radius: 8px; color: white; font-weight: bold; font-size: 20px; }
.low { background: #28a745; }
.medium { background: #fd7e14; }
.high { background: #ffc107; color: black; }
.critical { background: #dc3545; }
</style>
</head>
<body>
<h3>PoC - Naffinc</h3>
<div id="poc"></div>
<script>
let p = new URLSearchParams(location.search);
let type = p.get('type') || 'low';
let el = document.getElementById('poc');
if(type == 'low'){
  el.innerHTML = '<div class="box low">LOW</div>';
} else if(type == 'medium'){
  el.innerHTML = '<div class="box medium">MEDIUM</div>';
} else if(type == 'high'){
  el.innerHTML = '<div class="box high">HIGH</div>';
} else if(type == 'critical'){
  el.innerHTML = '<div class="box critical">CRITICAL</div>';
}
</script>
<p id="url"></p>
<script>document.getElementById('url').innerText = location.href;</script>
</body>
</html>
