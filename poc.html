<script>

var sevEl = document.getElementById('sev');

  sevEl.className='sev sev-critical';
  sevEl.textContent='CRITICAL - OAuth CODE Leak = ATO';

} else if(q.includes('token=')||q.includes('jwt=')||q.includes('session=')||q.includes('access_token=')||q.includes('id_token=')){

descEl.textContent = d + '\n\nURL: ' + href;
