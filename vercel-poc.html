<!DOCTYPE html>
<html>
<head>
<title>Vercel Open Redirect POC - naffincindonesia</title>
<meta property="og:title" content="Vercel Redirect POC">
</head>
<body style="font-family:monospace; padding:40px; background:#000; color:#0f0;">
<h1>[ POC ] Vercel -> naffincindonesia.github.io</h1>
<p>URL Asal: vercel.com</p>
<p>Redirect ke: <span id="url"></span></p>
<p id="status" style="font-size:20px; color:yellow;">Checking...</p>
<script>
document.getElementById('url').innerText = window.location.href;
const ref = document.referrer;
if(ref.includes('vercel.com')){
  document.getElementById('status').innerHTML = 'VULN CONFIRMED: Redirect from ' + ref + ' to this page';
  document.getElementById('status').style.color = 'red';
} else {
  document.getElementById('status').innerHTML = 'Direct access - trigger via vercel.com?next=https://naffincindonesia.github.io/vercel-poc.html';
}
</script>
</body>
</html>
